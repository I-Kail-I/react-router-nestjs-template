services:
  client:
    container_name: client
    build:
      context: .
      dockerfile: app/client/Dockerfile
    volumes:
      - /app/node_modules
    environment:
      - PORT=3000

  server:
    container_name: server
    build:
      context: .
      dockerfile: app/server/Dockerfile
    volumes:
      - /app/node_modules
    environment:
      - PORT=8000
